[package]
name = "bifrost-relayer"
version = "3.0.2"
description = "The core rust implementation for Bifrost relayer"
authors = { workspace = true }
homepage = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
build = "build.rs"

[dependencies]
# General
log = { workspace = true }
hex = { workspace = true }
env_logger = { workspace = true }
chrono = { workspace = true }
alloy = { workspace = true }
futures = { workspace = true }
clap = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = [
    "signal",
    "rt-multi-thread",
    "parking_lot",
] }
miniscript = { workspace = true }
bitcoincore-rpc = { workspace = true }
sentry = { workspace = true }
aws-sdk-kms = { workspace = true }
aws-config = { workspace = true }
sp-core = { workspace = true }
eyre = { workspace = true }
url = { workspace = true }
solana-sdk = { workspace = true }

# Bifrost Relayer
br-cli = { workspace = true }
br-client = { workspace = true }
br-periodic = { workspace = true }
br-primitives = { workspace = true }
br-metrics = { workspace = true }

# Substrate
sc-cli = { workspace = true }
sc-service = { workspace = true }
sc-sysinfo = { workspace = true }
sp-application-crypto = { workspace = true }
prometheus-endpoint = { workspace = true }
subxt = { workspace = true }

[build-dependencies]
substrate-build-script-utils = { workspace = true }

[[bin]]
name = "bifrost-relayer"
